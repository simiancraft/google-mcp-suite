name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for the whole workflow; the `release` job
# overrides with a broader block for semantic-release to push tags.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Test (with coverage)
        # lcov only: the text reporter's per-file table has outgrown what bun
        # can write to the Actions log without dying (WriteFailed mid-table);
        # the coverageThreshold pin in bunfig.toml enforces 100% either way,
        # and Codecov renders the per-file view from the lcov file.
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Dead code (knip)
        run: bun run check:knip

  release:
    name: Release
    needs: check
    # Gated on the RELEASE_ENABLED repo variable. Stays dormant until the
    # APP_ID + APP_PRIVATE_KEY secrets are configured (GitHub App that
    # bypasses main's ruleset for the chore(release) commit + tag).
    # Flip `gh variable set RELEASE_ENABLED --body true` to activate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Mint a short-lived App token so @semantic-release/git can push the
      # chore(release) commit + tag back to main. The App is in main's
      # ruleset bypass list; the default GITHUB_TOKEN is not.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Sigstore attestation for the published tarball. id-token: write
          # is already set in the job permissions.
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
